<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicDrop | AI Live Translation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .btn { background: #3b82f6; color: white; border: none; padding: 1rem 2rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; margin-top: 10px; }
        .btn:hover { background: #2563eb; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        #streamZone { display: none; } /* HIDDEN BY DEFAULT */
        .live-tag { color: #ef4444; font-weight: bold; font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 20px; }
        #status { font-size: 0.8rem; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div id="gateZone">
        <h2>🎙️ TripTalks MicDrop</h2>
        <p>Enter your details to join the session.</p>
        <form id="regForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="agency" placeholder="Travel Agency" required>
            <select id="prefLang">
                <option value="hi">Translate to: Hindi</option>
                <option value="ta">Translate to: Tamil</option>
            </select>
            <button type="submit" class="btn">Enter Stream</button>
        </form>
    </div>

    <div id="streamZone">
        <p class="live-tag">● LIVE AI TRANSLATION</p>
        <h3 id="welcomeMsg">Welcome</h3>
        <button id="startAudio" class="btn">🔊 Start Listening</button>
        <p id="status">Ready to receive audio...</p>
    </div>
</div>

<script>
    const G_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyamaVliSr6puEUQYUiOPdPSGEku11dR_e4G9C5kSdXj5j5qoBZP4cXXq21B4Y7NwzY/exec';
    const WSS_URL = 'wss://radiatus-unsystematising-jurnee.ngrok-free.dev'; 

    const regForm = document.getElementById('regForm');
    const gateZone = document.getElementById('gateZone');
    const streamZone = document.getElementById('streamZone');

    regForm.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const lang = document.getElementById('prefLang').value;
        
        const formData = {
            name: name,
            email: document.getElementById('email').value,
            agency: document.getElementById('agency').value,
            language: lang
        };

        // UI Transition
        gateZone.style.display = 'none';
        streamZone.style.display = 'block';
        document.getElementById('welcomeMsg').innerText = `Hello, ${name}`;

        // Send to Google Sheet (Async)
        fetch(G_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) });
    };

    document.getElementById('startAudio').onclick = function() {
        this.style.display = 'none';
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const socket = new WebSocket(WSS_URL);
        socket.binaryType = 'arraybuffer';

        socket.onmessage = async (event) => {
            try {
                const buffer = await audioCtx.decodeAudioData(event.data);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                document.getElementById('status').innerText = "🔊 Playing AI Translation...";
            } catch (e) {
                console.error("Audio decoding error.");
            }
        };
    };
</script>
</body>
</html>
