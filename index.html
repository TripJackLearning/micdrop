<!DOCTYPE html>
<html>
<head>
    <title>MicDrop | AI Audio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding-top: 50px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; display: inline-block; width: 300px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
        #status { margin-top: 20px; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>🎙️ TripTalks AI</h2>
    <p>Translation: <b>English → Hindi</b></p>
    <button id="startBtn" class="btn">🔊 START LISTENING</button>
    <div id="status">System Offline</div>
</div>

<script>
    // UPDATE THIS URL FROM YOUR NGROK TERMINAL
    const WSS_URL = 'wss://radiatus-unsystematising-jurnee.ngrok-free.dev'; 

    document.getElementById('startBtn').onclick = function() {
        this.style.background = "#10b981";
        this.innerText = "LISTENING...";
        document.getElementById('status').innerText = "Connecting to Host...";

        const socket = new WebSocket(WSS_URL);
        socket.binaryType = 'arraybuffer';

        socket.onmessage = (event) => {
            document.getElementById('status').innerText = "🔊 Playing Translation...";
            
            // 1. Convert incoming bytes to a virtual MP3 file
            const blob = new Blob([event.data], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            
            // 2. Play the virtual file
            const audio = new Audio(url);
            audio.play().catch(err => {
                document.getElementById('status').innerText = "⚠️ Interaction Required! Click screen.";
            });

            // 3. Clean up memory after playing
            audio.onended = () => {
                URL.revokeObjectURL(url);
                document.getElementById('status').innerText = "Ready for next sentence...";
            };
        };

        socket.onclose = () => {
            document.getElementById('status').innerText = "❌ Connection Lost";
        };
    };
</script>
</body>
</html>
