<!DOCTYPE html>
<html>
<head>
    <title>MicDrop Cloud</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding-top: 50px; }
        .btn { background: #3b82f6; padding: 15px; border: none; border-radius: 8px; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🎙️ AI Voice Postbox</h2>
    <button id="startBtn" class="btn" onclick="startPolling()">🔊 Start Listening</button>
    <p id="status">Waiting for user...</p>

    <script>
        // REPLACE THIS with your actual Firebase URL
        const FILE_URL = "https://storage.googleapis.com/micdrop-7fd11.appspot.com/latest.mp3";
        let lastTimestamp = "";

        function startPolling() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('status').innerText = "Watching for new translations...";
            
            setInterval(async () => {
                try {
                    // Check headers to see if file was modified
                    const head = await fetch(FILE_URL, { method: 'HEAD', cache: 'no-store' });
                    const currentModified = head.headers.get('Last-Modified');

                    if (currentModified && currentModified !== lastTimestamp) {
                        lastTimestamp = currentModified;
                        const audio = new Audio(FILE_URL + "?cb=" + Date.now());
                        audio.play();
                        document.getElementById('status').innerText = "🔊 Playing new message!";
                    }
                } catch (e) { console.log("Waiting for first file..."); }
            }, 2500);
        }
    </script>
</body>
</html>
