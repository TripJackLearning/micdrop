<!DOCTYPE html>
<html>
<head>
    <title>MicDrop P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: white; text-align: center; padding: 50px; }
        .box { border: 1px solid #444; padding: 20px; border-radius: 10px; background: #222; max-width: 400px; margin: auto; }
        .status { color: #00ff00; font-weight: bold; margin: 10px; }
        input { padding: 10px; width: 80%; margin: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🎙️ MicDrop P2P</h2>
    <p>Your ID: <span id="my-id" style="color: yellow;">...</span></p>
    
    <hr>
    
    <h3>Listen to a Friend</h3>
    <input type="text" id="peer-id" placeholder="Enter Friend's ID">
    <button id="call-btn">Connect & Listen</button>
    
    <div id="status" class="status">Waiting for connection...</div>
    <audio id="remote-audio" autoplay></audio>
</div>

<script>
    const peer = new Peer(); // Create a PeerJS object
    const status = document.getElementById('status');
    const remoteAudio = document.getElementById('remote-audio');

    // 1. Display your ID so you can send it to your friend
    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
        status.innerText = "Online. Share your ID or enter one.";
    });

    // 2. HOST SIDE: Handle incoming calls
    peer.on('call', (call) => {
        status.innerText = "Incoming connection...";
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            call.answer(stream); // Answer with your microphone stream
            status.innerText = "🔴 LIVE: Streaming your mic!";
        });
    });

    // 3. LISTENER SIDE: Call a friend
    document.getElementById('call-btn').onclick = () => {
        const friendID = document.getElementById('peer-id').value;
        status.innerText = "Connecting to " + friendID + "...";
        
        // We call them with an empty stream just to trigger the connection
        const call = peer.call(friendID, new MediaStream());
        
        call.on('stream', (remoteStream) => {
            status.innerText = "🔊 Connected! Listening...";
            remoteAudio.srcObject = remoteStream;
        });
    };
</script>
</body>
</html>
