<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicDrop Live Viewer</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: #1e293b; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        #feed { width: 100%; border-radius: 12px; border: 4px solid #3b82f6; background: #000; min-height: 240px; }
        #transcript { margin-top: 20px; height: 120px; overflow-y: auto; background: #0f172a; padding: 15px; text-align: left; border-radius: 10px; font-size: 14px; color: #cbd5e1; }
        .btn { background: #10b981; color: white; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: 0.3s; }
        .btn-active { background: #3b82f6; }
        .status-dot { height: 10px; width: 10px; background-color: #94a3b8; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎙️ MicDrop Live</h2>
        <button id="playBtn" class="btn">🔊 CLICK TO ACTIVATE AUDIO</button>
        <br>
        <img id="feed" src="" alt="Connecting to host...">
        <div id="transcript"><i>Waiting for speech...</i></div>
        <p style="font-size: 11px; margin-top: 15px;">
            <span id="dot" class="status-dot"></span> <span id="stat-text">Connecting...</span>
        </p>
    </div>

    <script>
        const ably = new Ably.Realtime('b7CLCQ.tJDE-g:sFqGGJ4L25J502sn2889nV-bRFApBRxjUth_Upo0nUA');
        const channel = ably.channels.get('micdrop-room');

        ably.connection.on('connected', () => {
            document.getElementById('dot').style.backgroundColor = "#10b981";
            document.getElementById('stat-text').innerText = "Live Connection Established";
        });

        document.getElementById('playBtn').onclick = function() {
            this.innerText = "🎧 AUDIO IS LIVE";
            this.classList.add('btn-active');
        };

        // VIDEO RECEIVER
        channel.subscribe('v', (m) => {
            document.getElementById('feed').src = "data:image/jpeg;base64," + m.data;
        });

        // TRANSCRIPT RECEIVER
        channel.subscribe('t', (m) => {
            const tDiv = document.getElementById('transcript');
            if(tDiv.innerText.includes("Waiting")) tDiv.innerHTML = "";
            tDiv.innerHTML += `<div style="margin-bottom:8px; color:#3b82f6;">• ${m.data}</div>`;
            tDiv.scrollTop = tDiv.scrollHeight;
        });

        // AUDIO RECEIVER
        channel.subscribe('a', (m) => {
            const audio = new Audio("data:audio/mp3;base64," + m.data);
            audio.play().catch(e => console.log("User must interact with page first"));
        });
    </script>
</body>
</html>
