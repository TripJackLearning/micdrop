<!DOCTYPE html>
<html>
<head>
    <title>MicDrop Live</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; }
        #feed { width: 480px; border-radius: 10px; border: 4px solid #3b82f6; margin-top: 20px; }
        #transcript { margin: 20px auto; width: 480px; height: 150px; overflow-y: auto; background: #1e293b; padding: 10px; text-align: left; }
    </style>
</head>
<body>
    <h1>🔴 MicDrop Live Stream</h1>
    <button id="playBtn" style="padding:10px; background:#10b981; color:white; border:none; cursor:pointer;">CLICK TO UNMUTE AUDIO</button>
    <br>
    <img id="feed" src="" alt="Waiting for Video...">
    <div id="transcript"></div>

    <script>
        const ably = new Ably.Realtime('YOUR_SUBSCRIBE_ONLY_KEY');
        const channel = ably.channels.get('micdrop-room');

        // VIDEO
        channel.subscribe('v', (m) => {
            document.getElementById('feed').src = "data:image/jpeg;base64," + m.data;
        });

        // TRANSCRIPT
        channel.subscribe('t', (m) => {
            const div = document.getElementById('transcript');
            div.innerHTML += `<div>▶ ${m.data}</div>`;
            div.scrollTop = div.scrollHeight;
        });

        // AUDIO
        channel.subscribe('a', (m) => {
            const audioData = "data:audio/mp3;base64," + m.data;
            const audio = new Audio(audioData);
            audio.play().catch(e => console.log("Click the green button first!"));
        });
    </script>
</body>
</html>
