<!DOCTYPE html>
<html>
<head>
    <title>MicDrop Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 400px; text-align: center; }
        .btn { background: #3b82f6; color: white; border: none; padding: 1rem; border-radius: 0.5rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 1rem; }
        input, select { width: 100%; padding: 0.7rem; margin: 0.5rem 0; border-radius: 0.4rem; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        #streamZone { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="gateZone">
        <h2>🎙️ TripTalks</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <select id="lang"><option value="hi">Hindi</option><option value="ta">Tamil</option></select>
            <button type="submit" class="btn">Enter Stream</button>
        </form>
    </div>

    <div id="streamZone">
        <p style="color: #ef4444; font-weight: bold;">● LIVE TRANSLATION</p>
        <button id="listenBtn" class="btn">🔊 Start Audio Feed</button>
        <p id="status" style="color: #94a3b8; font-size: 0.8rem; margin-top: 1rem;">Waiting for host...</p>
    </div>
</div>

<script>
    const WSS_URL = 'wss://radiatus-unsystematising-jurnee.ngrok-free.dev'; // UPDATE THIS
    const G_SHEET = 'https://script.google.com/macros/s/AKfycbyamaVliSr6puEUQYUiOPdPSGEku11dR_e4G9C5kSdXj5j5qoBZP4cXXq21B4Y7NwzY/exec';

    const regForm = document.getElementById('regForm');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    regForm.onsubmit = async (e) => {
        e.preventDefault();
        const data = { name: document.getElementById('name').value, lang: document.getElementById('lang').value };
        
        // UI Switch
        document.getElementById('gateZone').style.display = 'none';
        document.getElementById('streamZone').style.display = 'block';

        // Submit to Sheet
        fetch(G_SHEET, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
    };

    document.getElementById('listenBtn').onclick = function() {
        this.style.display = 'none';
        const socket = new WebSocket(WSS_URL);
        socket.binaryType = 'arraybuffer';

        socket.onmessage = async (event) => {
            try {
                const buffer = await audioCtx.decodeAudioData(event.data);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                document.getElementById('status').innerText = "🔊 Receiving English -> Hindi Translation";
            } catch (e) { console.error(e); }
        };
    };
</script>
</body>
</html>
