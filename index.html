<!DOCTYPE html>
<html>
<head>
    <title>MicDrop | Smooth Stream</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; text-align: center; padding-top: 100px; }
        .btn { background: #007bff; color: white; border: none; padding: 20px 40px; border-radius: 50px; font-size: 20px; cursor: pointer; }
        #status { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <h1>🎙️ MicDrop Live</h1>
    <button id="playBtn" class="btn">Start Listening</button>
    <div id="status">Ready</div>

    <script>
        const WSS_URL = 'wss://radiatus-unsystematising-jurnee.ngrok-free.dev';
        const playBtn = document.getElementById('playBtn');
        const status = document.getElementById('status');

        let audioCtx;
        let nextStartTime = 0;

        playBtn.onclick = () => {
            playBtn.style.display = 'none';
            status.innerText = "Connecting to high-quality stream...";
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            const socket = new WebSocket(WSS_URL);
            socket.binaryType = 'arraybuffer';

            socket.onmessage = async (event) => {
                // 1. Decode the Int16 bytes to Float32
                const int16Data = new Int16Array(event.data);
                const float32Data = new Float32Array(int16Data.length);
                for (let i = 0; i < int16Data.length; i++) {
                    float32Data[i] = int16Data[i] / 32768.0;
                }

                // 2. Create Audio Buffer
                const buffer = audioCtx.createBuffer(1, float32Data.length, 44100);
                buffer.getChannelData(0).set(float32Data);

                // 3. Scheduling (The Buffer Logic)
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);

                const currentTime = audioCtx.currentTime;
                // If we are behind, sync to now + a tiny safety buffer (0.1s)
                if (nextStartTime < currentTime) {
                    nextStartTime = currentTime + 0.1; 
                }

                source.start(nextStartTime);
                nextStartTime += buffer.duration;
                
                status.innerText = "🔊 Streaming Clean Audio";
            };

            socket.onclose = () => { status.innerText = "❌ Host Offline"; };
        };
    </script>
</body>
</html>
